spring.application.name=event-ingestion

#kafka
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

#redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

#rate-limiter
app.rate-limiter.enabled=true

app.rate-limiter.vehicle.enabled=true 

app.rate-limiter.token-bucket.vehicle.gps-event.enabled=true
app.rate-limiter.token-bucket.vehicle.gps-event.capacity=3600
app.rate-limiter.token-bucket.vehicle.gps-event.refill-rate=1 
app.rate-limiter.token-bucket.vehicle.gps-event.refill-period-s=1

app.rate-limiter.token-bucket.vehicle.battery-event.enabled=true
app.rate-limiter.token-bucket.vehicle.battery-event.capacity=540
app.rate-limiter.token-bucket.vehicle.battery-event.refill-rate=1
app.rate-limiter.token-bucket.vehicle.battery-event.refill-period-s=5

app.rate-limiter.token-bucket.vehicle.fuel-event.enabled=true
app.rate-limiter.token-bucket.vehicle.fuel-event.capacity=540
app.rate-limiter.token-bucket.vehicle.fuel-event.refill-rate=1
app.rate-limiter.token-bucket.vehicle.fuel-event.refill-period-s=5

app.rate-limiter.token-bucket.vehicle.diagnostic-event.enabled=true
app.rate-limiter.token-bucket.vehicle.diagnostic-event.capacity=60
app.rate-limiter.token-bucket.vehicle.diagnostic-event.refill-rate=1
app.rate-limiter.token-bucket.vehicle.diagnostic-event.refill-period-s=60

app.rate-limiter.token-bucket.vehicle.engine-telemetry.enabled=true 
app.rate-limiter.token-bucket.vehicle.engine-telemetry.capacity=360
app.rate-limiter.token-bucket.vehicle.engine-telemetry.refill-rate=1
app.rate-limiter.token-bucket.vehicle.engine-telemetry.refill-period-s=10
