spring.application.name=event-ingestion

#kafka
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

#redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

#rate-limiter
app.rate-limiter.enabled=true

app.rate-limiter.vehicle.enabled=true 

app.rate-limiter.token-bucket.vehicle.gps-event.enabled=true
app.rate-limiter.token-bucket.vehicle.gps-event.capacity=21600
app.rate-limiter.token-bucket.vehicle.gps-event.refill-rate=1 
app.rate-limiter.token-bucket.vehicle.gps-event.refill-period-s=1
